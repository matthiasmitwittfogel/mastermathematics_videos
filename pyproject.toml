[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[project]
name = "mastermathematics"
version = "1.0.0"
description = "Math animation scenes for MasterMathematics YouTube channel"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.20.1",
    "numpy>=2.1",
    "sympy>=1.12",
    "scipy>=1.13.0",
    "colour>=0.1.5",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.0",
]
voiceover = [
    "manim-voiceover>=0.3.0",
    "azure-cognitiveservices-speech",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    media
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by black)
    "F403",  # `from module import *` (allowed for manim patterns)
    "F405",  # Undefined from star imports
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = []
